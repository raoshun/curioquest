[project]
name = "curioquest"
version = "0.1.0"
description = "家庭内ローカルAI知育プラットフォーム CurioQuest（音声対話で考える力を育てる）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0",
    # faster-whisper は av の open(kwarg metadata_errors=...) を呼ぶが、av 19 で
    # 除去された（av 18 までは存在）。faster-whisper 側の追従まで上 Bound で守る。
    "av<19",
]

[project.scripts]
curioquest-api = "curioquest.api.main:main"
curioquest-backup = "curioquest.backup:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curioquest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ は設計仕様書。Markdown 内のコード例を ruff に整形させない
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
