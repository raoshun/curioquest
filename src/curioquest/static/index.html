<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CurioQuest こどもホーム</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    font-family: " Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    max-width: 720px; margin: 0 auto; padding: 1rem; background: #fff8ec; color: #4a3b2a;
  }
  h1 { font-size: 1.4rem; margin: 0.4rem 0 0.8rem; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 0.9rem 1.2rem; border-radius: 14px; border: 2px solid #d8b98c;
    background: #fff; cursor: pointer; font-weight: bold; color: #4a3b2a;
  }
  button.primary { background: #ffb74d; border-color: #e59a2f; }
  button:disabled { opacity: 0.45; }
  button.big { font-size: 1.15rem; padding: 1.1rem 1.6rem; }
  .card {
    background: #fff; border: 2px solid #eeddc0; border-radius: 16px;
    padding: 0.9rem 1rem; margin: 0.8rem 0;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  .status { color: #8a7a63; font-size: 0.9rem; min-height: 1.2em; }
  .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .chip { background: #f3e7d2; border-radius: 999px; padding: 0.35rem 0.8rem; font-size: 0.95rem; }
  .timebar { background: #f0e3cd; border-radius: 999px; height: 14px; overflow: hidden; margin: 0.4rem 0; }
  .timebar > div { background: #7bc96f; height: 100%; width: 0%; transition: width 0.4s; }
  .qa { min-height: 4rem; background: #fffdf6; border-radius: 12px; padding: 0.6rem; margin-top: 0.5rem; line-height: 1.6; }
  .reply { background: #fff3d6; }
  .hidden { display: none; }
  .count { font-size: 2rem; font-weight: bold; margin-right: 0.4rem; }
  label { font-size: 0.9rem; }
  input[type="text"], input[type="date"], input[type="number"] {
    font: inherit; padding: 0.4rem 0.6rem; border-radius: 8px; border: 1px solid #cbb894; width: 100%;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  td, th { padding: 0.3rem 0.2rem; border-bottom: 1px solid #f0e6d2; text-align: left; }
  .pinbox label { display: block; margin: 0.5rem 0; }
  .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .tabs button.active { background: #ffb74d; border-color: #e59a2f; }
  nav.top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
</style>
</head>
<body>
<!-- CurioQuest こどもホーム。子ども向け操作は PIN なし、保護者画面は PIN で守る (02-features 3-3)。 -->
<h1 id="pageTitle">CurioQuest</h1>

<!-- ============ こどもホーム (F01 3-3: 起動時に子を選ぶ) ============ -->
<section id="homeView">
  <div class="card" id="childPickCard">
    <h2>だれが つかう?</h2>
    <div class="chips" id="childChips"></div>
    <div class="row" style="margin-top:0.6rem">
      <button id="addChildBtn">はじめての こどもを とうろく</button>
    </div>
    <div class="status" id="childPickStatus"></div>
  </div>

  <div class="card" id="newChildCardHidden" hidden>
    <h2>こどもを とうろく</h2>
    <div class="pinbox">
      <label>nickname <input type="text" id="newName" maxlength="40" placeholder="ゆい"></label>
      <label>たんじょうび (任意) <input type="date" id="newBirthday"></label>
      <label>1日の つかえる じかん(分) <input type="number" id="newLimit" min="1" max="240" value="20"></label>
      <div class="row">
        <button class="primary" id="newChildSave">きめる</button>
        <button id="newChildCancel">もどる</button>
      </div>
      <div class="status" id="newChildStatus"></div>
    </div>
  </div>

  <div id="homeCard" class="card" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 id="homeName" style="margin:0"></h2>
      <button id="switchBtn" class="small">こどもの こうかん</button>
    </div>
    <div class="card" style="background:#fff8ec;margin-top:0.7rem">
      <h2>きょうの ミッション</h2>
      <p id="missionTitle" style="margin:0.2rem 0">よみこみ中…</p>
      <p class="status" id="missionQuestion"></p>
    </div>
    <div class="card" style="background:#fff8ec">
      <h2>のこれる じかん</h2>
      <div class="timebar"><div id="timeFill"></div></div>
      <p id="timeText" style="margin:0.2rem 0"></p>
    </div>
    <div class="row">
      <button class="primary big" id="startBtn">はなして たのしむ</button>
      <button id="stampsBtn">きみの スタンプ</button>
      <button id="diaryBtn" title="自分のことは自分で終われる。きみが やめる まで やめないよ">やすむ</button>
    </div>
    <div class="status" id="homeStatus"></div>
  </div>
</section>

<!-- ============ はなす (F01 3-4 停止词语・F07 13 時間経過年) ============ -->
<section id="talkView" hidden>
  <nav class="top">
    <h1 style="font-size:1.1rem">はなしているよ</h1>
    <div class="row">
      <button id="endTalkBtn">やめる</button>
      <button id="micBtn" disabled class="big">マイクで はなす</button>
    </div>
  </nav>
  <div class="row" style="margin-top:0.5rem">
    <button id="stopWordHi" disabled>ストップ「はい!」</button>
    <button id="stopWordYada" disabled>ストップ「やだ!」</button>
  </div>
  <div class="card">
    <div id="transcript">(ここで なにか おしえて くるよ)</div>
    <div class="qa reply" id="reply">(character の こたえは ここに でる)</div>
    <div class="status" id="turnStatus"></div>
    <span id="timer"></span>
    <div class="status" id="recStatus">はなす のは マイクボタンをおしたときだけ。音声は保存されないよ</div>
  </div>
</section>

<!-- ============ スタンプ ============ -->
<section id="stampView" hidden>
  <nav class="top">
    <h1 style="font-size:1.1rem">きみの スタンプ</h1>
    <button id="stampsBack">もどる</button>
  </nav>
  <div class="card">
    <p><span class="count" id="stampEarned">0</span>こ あつめた!(ぜんぶで <span id="stampAvail">0</span>こ あるよ)</p>
    <div class="chips" id="stampsGrid"></div>
  </div>
</section>

<!-- ============ 保護者エリア の とちゅう (F01 3-3 PIN かけ) ============ -->
<nav class="top" style="margin-top:1.2rem">
  <span class="status">おとなエリア へ 移動</span>
  <button id="parentBtn">おとなエリア</button>
</nav>

<script>
// 子画面ロジック。API 既定値は子ども向けで PIN 不要、保護者書込みのみ PIN 必須。
const $ = (id) => document.getElementById(id);
const set = (id, text) => { const el = $(id); if (el) el.textContent = text; };
const state = { childId: null, child: null, session: null };
const api = async (path, opts = {}) => {
  const res = await fetch(`/api${opts.v1 === false ? "" : ""}${path}`, { headers: { "Content-Type": "application/json" }, ...opts });
  return res;
};
const get = async (path) => {
  const res = await api(path);
  if (!res.ok) {
    let d = res.statusText;
    try { d = (await res.json()).detail ?? d; } catch { /* ignore */ }
    const e = new Error(d); e.status = res.status; throw e;
  }
  return res.status === 204 ? null : res.json();
};
const post = async (path, body, opts = {}) => {
  const res = await api(path, { method: "POST", body: body === undefined ? undefined : JSON.stringify(body), ...opts });
  if (!res.ok) {
    let d = res.statusText;
    try { d = (res.headers.get("content-type")?.includes("json")) ? (await res.json()).detail ?? d : d; } catch { /* ignore */ }
    const e = new Error(d); e.status = res.status; throw e;
  }
  return res.status === 204 ? null : res.json();
};

function show(view) {
  for (const id of ["homeView", "talkView", "stampView"]) $(id).hidden = id !== view;
  $("pageTitle").style.display = view === "homeView" ? "" : "none";
}

// ---- 子一覧・選択 ----
async function loadChildren() {
  set("childPickStatus", "ようこそ!もよっているよ…");
  const kids = await get("/children");
  const wrap = $("childChips");
  wrap.textContent = "";
  if (kids.length === 0) {
    set("childPickStatus", "まずは こどもを とうろくしてね");
    return;
  }
  for (const k of kids) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = k.nickname;
    b.addEventListener("click", () => selectChild(k.id));
    wrap.appendChild(b);
  }
  set("childPickStatus", "");
}
async function selectChild(id) {
  state.childId = id;
  try {
    state.child = await get(`/children/${id}`);
  } catch (err) { set("homeStatus", `えらぶことが できなかった: ${err.message}`); return; }
  $("childPickCard").hidden = true;
  $("newChildCardHidden").hidden = true;
  $("homeCard").hidden = false;
  $("homeName").textContent = `${state.child.nickname} さん`;
  await refreshHome();
}
async function refreshHome() {
  setStatus(`progress: loading…`);
  try {
    const prog = await get(`/children/${state.childId}/progress`);
    $("missionTitle").textContent = prog.today_mission ? prog.today_mission.title : "きょうの ふつうの もんだいは まだだよ";
    $("missionQuestion").textContent = prog.today_mission ? prog.today_mission.question : "";
    const limitSec = prog.daily_limit_minutes * 60;
    const remain = prog.remaining_seconds ?? 0;
    const used = Math.min(100, limitSec ? (prog.used_seconds_today / limitSec) * 100 : 0);
    $("timeFill").style.width = `${Math.max(0, Math.min(100, 100 - used))}%`;
    $("timeText").textContent =
      `けさから ${Math.floor(prog.used_seconds_today / 60)}ふん つかって / 一日 ${prog.daily_limit_minutes}ふんまで / のこれる ${Math.ceil(remain / 60)}ふん`;
    set("homeStatus", prog.remaining_seconds === 0 ? "きょうの じかんを ぜんぶ つかっちゃったよ。あした また あそぼう!" : "");
    $("startBtn").disabled = prog.remaining_seconds === 0;
  } catch (err) { set("homeStatus", `きょうの ようす が とれなかった: ${err.message}`); }
}
function setStatus(t) { const s = $("timeText"); if (s) s.title = t; }

$("addChildBtn").addEventListener("click", () => { $("childPickCard").hidden = true; $("newChildCardHidden").hidden = false; });
$("newChildCancel").addEventListener("click", () => { $("newChildCardHidden").hidden = true; $("childPickCard").hidden = false; });
$("newChildSave").addEventListener("click", async () => {
  const nickname = $("newName").value.trim();
  if (!nickname) { set("newChildStatus", "なまえを いれてね"); return; }
  const body = { nickname, daily_limit_minutes: Number($("newLimit").value) || 20 };
  if ($("newBirthday").value) body.birthday = $("newBirthday").value;
  try {
    const child = await post("/children", body);
    set("newChildStatus", `${child.nickname} さんを とうろくしたよ!`);
    await loadChildren();
    selectChild(child.id);
  } catch (err) { set("newChildStatus", `とうろく しっぱい: ${err.message}`); }
});
$("switchBtn").addEventListener("click", () => {
  $("homeCard").hidden = true;
  $("childPickCard").hidden = false;
  $("childPickStatus").textContent = "こどもを えらんでね";
});

// ---- はなす ----
$("startBtn").addEventListener("click", async () => {
  set("homeStatus", "きょうの ぎもんを よんで、おはなしを はじめるよ…(じかんが かかる ことが あるよ)");
  $("startBtn").disabled = true;
  try {
    state.session = await post("/sessions", { child_id: state.childId });
    show("talkView");
    $("micBtn").disabled = false;
    $("stopWordHi").disabled = false;
    $("stopWordYada").disabled = false;
    set("turnStatus", state.session.reply);
    set("recStatus", "マイクでも あいことばでも おしえられるよ");
  } catch (err) {
    set("homeStatus", `はじめることが できなかった: ${err.message}`);
    $("startBtn").disabled = false;
  }
});
$("endTalkBtn").addEventListener("click", endTalk);
async function endTalk() {
  if (state.session) {
    try { await post(`/sessions/${state.session.session_id}/complete`, {}); } catch { /* 終了失敗も終了したことにする */ }
  }
  state.session = null;
  $("micBtn").disabled = true; $("stopWordHi").disabled = true; $("stopWordYada").disabled = true;
  show("homeView");
  await refreshHome();
}
$("stampsBtn").addEventListener("click", async () => {
  show("stampView");
  try {
    const st = await get(`/children/${state.childId}/stamps`);
    $("stampEarned").textContent = st.earned;
    $("stampAvail").textContent = st.available;
    const g = $("stampsGrid");
    g.textContent = "";
    for (const s of st.stamps) {
      const c = document.createElement("span");
      c.className = "chip";
      c.textContent = `★ ${s.name}`;
      c.title = s.description;
      g.appendChild(c);
    }
  } catch (err) { $("stampEarned").textContent = "?"; }
});
$("stampsBack").addEventListener("click", () => { show("homeView"); refreshHome(); });
$("diaryBtn").addEventListener("click", async () => {
  // F01 「自分で終われる」: 利用時間リミットと関係なく、子ども自身がここで止める。
  set("homeStatus", "きょうの ようす を みているよ…");
  await refreshHome();
  set("homeStatus", "ここで いつでも やすめるよ。きょうを やめるのも ぜんぶ きみの おもいどおり!");
});

// 音声録音・ターン送信(最小検証ページから受け継ぎ)
let mediaStream = null, audioCtx = null, processor = null, sourceNode = null;
let recording = false, recordedChunks = [], recordStart = 0, timerId = null, busy = false;
$("micBtn").addEventListener("click", () => (recording ? stopRecording() : startRecording()));
async function startRecording() {
  set("recStatus", "マイク じゅんび中…「とどける(許可)」を おしてね");
  try {
    audioCtx = audioCtx ?? new AudioContext();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    if (!mediaStream || !mediaStream.active) mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    const rate = audioCtx.sampleRate;
    processor.onaudioprocess = (e) => {
      const data = downsample(e.inputBuffer.getChannelData(0), rate, 16000);
      const pcm = new Int16Array(data.length);
      for (let i = 0; i < data.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(data[i] * 32767)));
      recordedChunks.push(pcm);
    };
    sourceNode.connect(processor);
    processor.connect(audioCtx.destination);
    recording = true;
    recordStart = performance.now();
    timerId = setInterval(() => $("timer").textContent = `${((performance.now() - recordStart) / 1000).toFixed(1)}秒`, 100);
    $("micBtn").textContent = "おわったよ";
    set("recStatus", "ろくおん中… おなじ ボタンを おすと おくるよ");
  } catch (err) {
    set("recStatus", `マイクが つかえなかった(${err.name})。ブラウザの マイク きょかを みとめてね`);
  }
}
function stopRecording() {
  clearInterval(timerId);
  recording = false;
  if (processor) { processor.onaudioprocess = null; processor.disconnect(); processor = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  $("micBtn").textContent = "マイクで はなす";
  const total = recordedChunks.reduce((n, c) => n + c.length, 0);
  const pcm = new Int16Array(total);
  let off = 0;
  for (const c of recordedChunks) { pcm.set(c, off); off += c.length; }
  recordedChunks = [];
  if (total === 0) { set("recStatus", "おとが とどかなかったよ(おくってないよ)。もういちど おしえてね"); return; }
  postVoice(encodeWav(pcm, 16000), Math.max(1, Math.round((performance.now() - recordStart) / 1000)));
}
async function postVoice(wav, seconds) {
  if (!state.session || busy) return;
  busy = true;
  set("turnStatus", "こえを おくって、かんがえて もらっているよ…");
  try {
    const res = await fetch(`/api/sessions/${state.session.session_id}/voice?seconds_spent=${seconds}`, {
      method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: wav });
    if (!res.ok) {
      let d = res.statusText;
      try { d = (await res.json()).detail ?? d; } catch { /* ignore */ }
      set("turnStatus", `おくることができなかった: ${d}`);
      return;
    }
    renderTurn({ ...(await res.json()) }, "(こえで こたえたよ)");
  } catch (err) { set("turnStatus", `つながり が きれた: ${err.message}`); }
  finally { busy = false; }
}
async function sendWords(text) {
  if (!state.session || busy) return;
  busy = true;
  set("turnStatus", "おてがみを おくって いるよ…");
  try {
    const out = await post(`/sessions/${state.session.session_id}/message`, { text, seconds_spent: 0 });
    renderTurn(out, text);
  } catch (err) { set("turnStatus", `おてがみ しっぱい: ${err.message}`); }
  finally { busy = false; }
}
$("stopWordHi").addEventListener("click", () => sendWords("はい!"));
$("stopWordYada").addEventListener("click", () => sendWords("やだ!"));
function renderTurn(out, words) {
  if (out.thinking_summary) $("transcript").textContent = `きろく: ${out.thinking_summary}`;
  $("reply").textContent = out.reply;
  const notes = [];
  if (out.stamps_awarded?.length) notes.push(`スタンプを ゲット: ${out.stamps_awarded.join(" / ")}`);
  if (out.finished) notes.push(`${out.end_reason ?? "おわり"} で おはなしを やすんだよ`);
  set("turnStatus", notes.join("/") || "スタンプ げットは ないよ");
  playAudio(out);
}
async function playAudio(out) {
  if (!out.voice_available || !out.audio_wav_b64) return;
  try {
    const bytes = Uint8Array.from(atob(out.audio_wav_b64), (c) => c.charCodeAt(0));
    const a = new Audio(URL.createObjectURL(new Blob([bytes], { type: "audio/wav" })));
    await a.play();
  } catch { /* 自動再生ブロック等は黙ってテキストだけで続ける */ }
}
function downsample(buf, fromRate, toRate) {
  if (fromRate === toRate) return buf;
  const ratio = fromRate / toRate;
  const out = new Float32Array(Math.floor(buf.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const s = Math.floor(i * ratio), e = Math.min(Math.floor((i + 1) * ratio), buf.length);
    let sum = 0;
    for (let j = s; j < e; j++) sum += buf[j];
    out[i] = sum / (e - s);
  }
  return out;
}
function encodeWav(pcm, rate) {
  const b = new DataView(new ArrayBuffer(44 + pcm.length * 2));
  const put = (o, s) => { for (let i = 0; i < s.length; i++) b.setUint8(o + i, s.charCodeAt(i)); };
  put(0, "RIFF"); b.setUint32(4, 36 + pcm.length * 2, true); put(8, "WAVE");
  put(12, "fmt "); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, rate, true); b.setUint32(28, rate * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
  put(36, "data"); b.setUint32(40, pcm.length * 2, true);
  for (let i = 0; i < pcm.length; i++) b.setInt16(44 + i * 2, pcm[i], true);
  return new Blob([b.buffer], { type: "audio/wav" });
}

// ---- 保護者エリア ----
$("parentBtn").addEventListener("click", () => { window.location.href = "/parent"; });

document.addEventListener("DOMContentLoaded", () => { loadChildren().catch((e) => set("childPickStatus", `ようすを とれなかったよ: ${e.message}`)); });
window.selectChild = selectChild; // devtools からも選べるようにする
</script>
</body>
</html>
